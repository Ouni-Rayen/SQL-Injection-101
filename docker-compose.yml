services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: change-me-root
      MYSQL_DATABASE: vault
      MYSQL_USER: ctf
      MYSQL_PASSWORD: ctfpass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-me-root"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      DB_HOST: db
      DB_USER: ctf
      DB_PASS: ctfpass
      DB_NAME: vault
      FLAG: "Securinets{h4sh_t4g_c0mm3nts_4r3_4_th1ng}"
      SHOW_QUERY: "0"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
